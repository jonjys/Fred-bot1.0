name: Hyperopt

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of hyperopt epochs"
        required: false
        default: "500"

permissions:
  contents: write

# Shares a queue with backtest.yml's group so their result commits to the
# same branch don't race each other (see backtest.yml for why).
concurrency:
  group: ci-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hyperopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TA-Lib C library
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget -q https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4
          ./configure --prefix=/usr
          make -j"$(nproc)"
          sudo make install

      - name: Install Python dependencies
        run: pip install "freqtrade[hyperopt]" -r bot/requirements.txt

      - name: Download data (Binance, falls back to OKX if blocked)
        id: download
        working-directory: bot
        run: |
          if freqtrade download-data \
            --userdir user_data \
            --exchange binance \
            --pairs BTC/USDT ETH/USDT SOL/USDT \
            --timeframes 15m \
            --timerange 20250516-20250816
          then
            echo "config_args=-c user_data/config.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Binance data download failed (likely blocked this runner's IP with HTTP 451) - falling back to OKX for this run. See README for details."
            freqtrade download-data \
              --userdir user_data \
              --exchange okx \
              --pairs BTC/USDT ETH/USDT SOL/USDT \
              --timeframes 15m \
              --timerange 20250516-20250816
            echo "config_args=-c user_data/config.json -c user_data/config-okx-fallback.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run hyperopt
        working-directory: bot
        run: |
          freqtrade hyperopt \
            ${{ steps.download.outputs.config_args }} \
            --userdir user_data \
            --strategy FredbV2Strategy \
            --hyperopt-loss ProfitFactorHyperOptLoss \
            --timerange 20250516-20250816 \
            --epochs ${{ github.event.inputs.epochs }} \
            --spaces buy sell roi stoploss trailing \
            -j -1

      - name: Re-run backtest with best params and refresh dashboard data
        working-directory: bot
        run: |
          freqtrade backtesting \
            ${{ steps.download.outputs.config_args }} \
            --userdir user_data \
            --strategy FredbV2Strategy \
            --timerange 20250516-20250816 \
            --export trades
          python3 scripts/export_summary.py

      - name: Publish summary to dashboard
        run: |
          mkdir -p dashboard/public
          cp bot/user_data/backtest_results/latest.json dashboard/public/backtest-latest.json

      # workflow_dispatch pins checkout to the commit SHA at *dispatch* time,
      # not at job-start time - after an 8+ minute hyperopt run, main has
      # near-certainly moved (e.g. a concurrent backtest.yml push-triggered
      # run). A plain commit+push races that and silently loses its results
      # to a rejected non-fast-forward push. Save our output files, hard
      # reset onto the actual latest main, then reapply and commit - this
      # can't conflict since we're always writing our own newer version of
      # exactly these files, not merging git history.
      - name: Commit and push results (rebase onto latest main first)
        run: |
          mkdir -p /tmp/hyperopt-out
          cp bot/user_data/backtest_results/latest.json /tmp/hyperopt-out/latest.json
          cp dashboard/public/backtest-latest.json /tmp/hyperopt-out/backtest-latest.json
          cp bot/user_data/strategies/FredbV2Strategy.json /tmp/hyperopt-out/FredbV2Strategy.json
          cp bot/user_data/hyperopt_results/*.fthypt /tmp/hyperopt-out/ 2>/dev/null || true

          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          mkdir -p bot/user_data/backtest_results dashboard/public bot/user_data/hyperopt_results
          cp /tmp/hyperopt-out/latest.json bot/user_data/backtest_results/latest.json
          cp /tmp/hyperopt-out/backtest-latest.json dashboard/public/backtest-latest.json
          cp /tmp/hyperopt-out/FredbV2Strategy.json bot/user_data/strategies/FredbV2Strategy.json
          cp /tmp/hyperopt-out/*.fthypt bot/user_data/hyperopt_results/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/user_data/strategies/FredbV2Strategy.json \
            bot/user_data/hyperopt_results/*.fthypt \
            bot/user_data/backtest_results/latest.json \
            dashboard/public/backtest-latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update hyperopt results and best params [skip vercel]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying against latest main..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "::error::Failed to push hyperopt results after 5 attempts."
          exit 1
